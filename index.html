<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Triangle Eraser</title>
<style>
  :root {
    --bg: #14161a; --panel: #1d2026; --line: #2b3038; --text: #d9dde3; --dim: #8b93a1;
    --accent: #ff8a1f; --accent-ink: #1a1000; --danger: #e5484d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  #app { display: flex; flex-direction: column; height: 100%; }
  #toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 8px 10px;
    background: var(--panel); border-bottom: 1px solid var(--line); }
  .sep { width: 1px; align-self: stretch; background: var(--line); margin: 0 4px; }
  button, label.btn { appearance: none; border: 1px solid var(--line); background: #262a32; color: var(--text);
    padding: 6px 11px; border-radius: 6px; cursor: pointer; font: inherit; display: inline-flex; align-items: center; gap: 6px; }
  button:hover:not(:disabled), label.btn:hover { background: #30353f; }
  button:disabled { opacity: .4; cursor: default; }
  button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button.danger { border-color: #5a2a2d; }
  button.danger:hover:not(:disabled) { background: var(--danger); color: #fff; }
  kbd { font: 11px ui-monospace, Consolas, monospace; color: var(--dim); background: #15171b;
    border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
  button.on kbd { color: var(--accent-ink); background: #ffffff40; border-color: transparent; }
  label.chk { display: inline-flex; align-items: center; gap: 5px; color: var(--dim); cursor: pointer; user-select: none; }
  input[type=file] { display: none; }
  #stage { position: relative; flex: 1; min-height: 0; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #box { position: absolute; display: none; border: 1px solid var(--accent); background: #ff8a1f26; pointer-events: none; }
  #drop { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    background: #14161acc; border: 2px dashed var(--accent); font-size: 18px; pointer-events: none; }
  #empty { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 10px; align-items: center;
    justify-content: center; color: var(--dim); pointer-events: none; text-align: center; }
  #empty b { color: var(--text); font-size: 17px; font-weight: 600; }
  #status { display: flex; justify-content: space-between; gap: 12px; padding: 6px 12px; background: var(--panel);
    border-top: 1px solid var(--line); color: var(--dim); }
  #status span:first-child { color: var(--text); font-variant-numeric: tabular-nums; }
  #toast { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); background: var(--danger); color: #fff;
    padding: 8px 14px; border-radius: 6px; display: none; max-width: 80%; }
</style>
</head>
<body>
<div id="app">
  <div id="toolbar">
    <label class="btn" title="Open STL or OBJ">Open… <input id="file" type="file" accept=".stl,.obj"></label>
    <button id="demo" title="Load a test sphere">Demo</button>
    <div class="sep"></div>
    <button id="boxTool" title="Drag to box-select (also: hold Shift)">Box select <kbd>B</kbd></button>
    <label class="chk" title="On: only triangles visible on screen. Off: x-ray, includes hidden ones"><input type="checkbox" id="visOnly" checked> Visible only</label>
    <button id="all">Select all <kbd>A</kbd></button>
    <button id="invert">Invert <kbd>I</kbd></button>
    <button id="clear">Deselect <kbd>Esc</kbd></button>
    <div class="sep"></div>
    <button id="del" class="danger">Delete <kbd>Del</kbd></button>
    <button id="undo">Undo <kbd>Ctrl+Z</kbd></button>
    <div class="sep"></div>
    <button id="wire" title="Show triangle edges">Wireframe <kbd>W</kbd></button>
    <button id="home" title="Frame the selection, or the whole part if nothing is selected">Focus <kbd>F</kbd></button>
    <div class="sep"></div>
    <button id="saveStl">Save STL</button>
    <button id="saveObj">Save OBJ</button>
  </div>
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="box"></div>
    <div id="empty"><b>Drop an STL or OBJ file here</b><span>Click a triangle to select · drag with Shift (or Box select) for many<br>Ctrl+drag adds · Alt+drag subtracts · Delete removes</span></div>
    <div id="drop">Drop to load</div>
    <div id="busy" style="position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#14161acc;font-size:16px">Loading…</div>
    <div id="toast"></div>
  </div>
  <div id="status"><span id="info">No mesh</span><span>Left-drag orbit · right-drag pan · wheel zoom</span></div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';

const $ = id => document.getElementById(id);
const canvas = $('c'), stage = $('stage'), boxEl = $('box');

// ---------- scene ----------
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0x000000, 1);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14161a);
const camera = new THREE.PerspectiveCamera(45, 1, 0.01, 1000);
scene.add(camera);
scene.add(new THREE.HemisphereLight(0xffffff, 0x444455, 1.2));
const headlight = new THREE.DirectionalLight(0xffffff, 2.2);
headlight.position.set(0.4, 0.8, 1);
camera.add(headlight);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;

// separate scene: every triangle flat-colored with its index+1, for exact GPU picking
const idScene = new THREE.Scene();
const idMaterial = new THREE.ShaderMaterial({
  vertexShader: 'attribute vec3 idc; varying vec3 v; void main(){ v = idc; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
  fragmentShader: 'varying vec3 v; void main(){ gl_FragColor = vec4(v, 1.0); }',
  side: THREE.DoubleSide, blending: THREE.NoBlending,
});
const rt = new THREE.WebGLRenderTarget(1, 1, { depthBuffer: true });

const material = new THREE.MeshStandardMaterial({
  vertexColors: true, flatShading: true, side: THREE.DoubleSide, roughness: 0.65, metalness: 0.05,
  polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1,
});
const wireMaterial = new THREE.MeshBasicMaterial({ color: 0x000000, wireframe: true, transparent: true, opacity: 0.35 });

const BASE = [184, 194, 209], SEL = [255, 115, 13];   // 8-bit vertex colors keep memory low on big meshes
let meshRadius = 1;

// ---------- state ----------
let positions = new Float32Array(0);   // 9 floats per triangle
let nTri = 0;
let selected = new Uint8Array(0);
let selCount = 0;
let geom = null, idGeom = null, mesh = null, wire = null, idMesh = null;
let fileName = 'mesh';
let undoStack = [];
let boxTool = false;

function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = 'none', 4000);
}

function updateUI() {
  $('info').textContent = nTri || mesh
    ? `${nTri.toLocaleString()} triangles · ${selCount.toLocaleString()} selected · ${fileName}`
    : 'No mesh';
  $('empty').style.display = mesh ? 'none' : 'flex';
  const has = nTri > 0;
  $('del').disabled = selCount === 0;
  $('undo').disabled = undoStack.length === 0;
  for (const id of ['all', 'invert', 'clear', 'saveStl', 'saveObj', 'home']) $(id).disabled = !has;
  $('clear').disabled = selCount === 0;
}

// ---------- mesh build ----------
function setMesh(pos, fit) {
  for (const g of [geom, idGeom]) g && g.dispose();
  if (mesh) { scene.remove(mesh, wire); idScene.remove(idMesh); }

  positions = pos;
  nTri = pos.length / 9;
  selected = new Uint8Array(nTri);
  selCount = 0;

  const colors = new Uint8Array(pos.length);
  const ids = new Uint8Array(pos.length);
  for (let i = 0; i < nTri; i++) {
    const id = i + 1, r = id & 255, g = (id >> 8) & 255, b = (id >> 16) & 255;
    for (let v = 0; v < 3; v++) {
      const o = i * 9 + v * 3;
      colors[o] = BASE[0]; colors[o + 1] = BASE[1]; colors[o + 2] = BASE[2];
      ids[o] = r; ids[o + 1] = g; ids[o + 2] = b;
    }
  }
  const posAttr = new THREE.BufferAttribute(pos, 3);
  geom = new THREE.BufferGeometry();
  geom.setAttribute('position', posAttr);
  geom.setAttribute('color', new THREE.BufferAttribute(colors, 3, true));
  idGeom = new THREE.BufferGeometry();
  idGeom.setAttribute('position', posAttr);
  idGeom.setAttribute('idc', new THREE.BufferAttribute(ids, 3, true));

  const keepOffset = mesh ? mesh.position.clone() : new THREE.Vector3();
  mesh = new THREE.Mesh(geom, material);
  wire = new THREE.Mesh(geom, wireMaterial);
  wire.visible = $('wire').classList.contains('on');
  idMesh = new THREE.Mesh(idGeom, idMaterial);
  for (const m of [mesh, wire, idMesh]) { m.frustumCulled = false; m.position.copy(keepOffset); }
  scene.add(mesh, wire);
  idScene.add(idMesh);

  if (fit) initialFit();
  updateUI();
}

function initialFit() {
  geom.computeBoundingBox();
  const box = geom.boundingBox;
  if (box.isEmpty()) return;
  const c = box.getCenter(new THREE.Vector3());
  for (const m of [mesh, wire, idMesh]) m.position.copy(c).negate();
  meshRadius = Math.max(box.getSize(new THREE.Vector3()).length() / 2, 1e-6);
  frameBounds(box, false);
}

// frame a box given in mesh-local coordinates; keepDir preserves the current viewing direction
function frameBounds(box, keepDir) {
  const center = box.getCenter(new THREE.Vector3()).add(mesh.position);
  const radius = Math.max(box.getSize(new THREE.Vector3()).length() / 2, meshRadius * 1e-3);
  const dir = camera.position.clone().sub(controls.target);
  if (!keepDir || dir.lengthSq() < 1e-12) dir.set(0.6, 0.5, 1);
  dir.normalize();
  const vf = THREE.MathUtils.degToRad(camera.fov) / 2, hf = Math.atan(Math.tan(vf) * camera.aspect);
  const dist = radius / Math.sin(Math.min(vf, hf)) * 1.1;
  controls.target.copy(center);
  camera.position.copy(center).addScaledVector(dir, dist);
  camera.near = meshRadius / 500; camera.far = meshRadius * 100 + dist;
  camera.updateProjectionMatrix();
  controls.update();
}

function focusView() {
  if (!nTri) return;
  const box = new THREE.Box3();
  if (selCount) {
    for (let i = 0; i < nTri; i++) {
      if (!selected[i]) continue;
      for (let v = 0; v < 3; v++) { const o = i * 9 + v * 3; box.expandByPoint(_v.set(positions[o], positions[o + 1], positions[o + 2])); }
    }
  } else {
    geom.computeBoundingBox(); box.copy(geom.boundingBox);
  }
  if (!box.isEmpty()) frameBounds(box, true);
}
const _v = new THREE.Vector3();

// ---------- loading ----------
function geometryToPositions(g) {
  const ng = g.index ? g.toNonIndexed() : g;
  const a = ng.attributes.position;
  const out = new Float32Array(a.count * 3);
  for (let i = 0; i < a.count; i++) { out[i * 3] = a.getX(i); out[i * 3 + 1] = a.getY(i); out[i * 3 + 2] = a.getZ(i); }
  return out;
}

// Byte-level OBJ parser: only reads `v` and `f` lines, fan-triangulates polygons, supports negative indices.
// Far lighter on memory/time than a general loader for files in the hundreds of MB.
function parseOBJ(bytes) {
  const n = bytes.length;
  let p = 0;
  let verts = new Float32Array(3 << 20), vn = 0;
  let tris = new Float32Array(9 << 20), tn = 0;

  const skipWs = () => { while (p < n && (bytes[p] === 32 || bytes[p] === 9)) p++; };
  const atEol = () => p >= n || bytes[p] === 10 || bytes[p] === 13;
  const readNum = () => {
    skipWs();
    let c = bytes[p], s = 1, x = 0;
    if (c === 45) { s = -1; p++; } else if (c === 43) p++;
    while ((c = bytes[p]) >= 48 && c <= 57) { x = x * 10 + c - 48; p++; }
    if (c === 46) {
      p++; let f = 0.1;
      while ((c = bytes[p]) >= 48 && c <= 57) { x += (c - 48) * f; f *= 0.1; p++; }
    }
    if (c === 101 || c === 69) {
      p++; let es = 1, e = 0;
      if (bytes[p] === 45) { es = -1; p++; } else if (bytes[p] === 43) p++;
      while ((c = bytes[p]) >= 48 && c <= 57) { e = e * 10 + c - 48; p++; }
      x *= Math.pow(10, es * e);
    }
    return s * x;
  };
  // returns zero-based vertex index, or -1 at end of line / bad token
  const readIdx = () => {
    skipWs();
    if (atEol()) return -1;
    let s = 1, x = 0, c = bytes[p];
    if (c === 45) { s = -1; p++; }
    while ((c = bytes[p]) >= 48 && c <= 57) { x = x * 10 + c - 48; p++; }
    while (p < n && (c = bytes[p]) !== 32 && c !== 9 && c !== 10 && c !== 13) p++;   // skip /vt/vn
    return s < 0 ? vn - x : x - 1;
  };
  const ring = [];

  while (p < n) {
    const c = bytes[p], c1 = bytes[p + 1];
    if (c === 118 && (c1 === 32 || c1 === 9)) {          // v x y z
      p++;
      if (vn * 3 + 3 > verts.length) { const g = new Float32Array(verts.length * 2); g.set(verts); verts = g; }
      verts[vn * 3] = readNum(); verts[vn * 3 + 1] = readNum(); verts[vn * 3 + 2] = readNum();
      vn++;
    } else if (c === 102 && (c1 === 32 || c1 === 9)) {   // f a b c ...
      p++;
      ring.length = 0;
      for (;;) {
        const i = readIdx();
        if (i === -1 && atEol()) break;
        ring.push(i);
      }
      for (let k = 1; k + 1 < ring.length; k++) {
        const a = ring[0], b = ring[k], d = ring[k + 1];
        if (a < 0 || b < 0 || d < 0 || a >= vn || b >= vn || d >= vn) continue;
        if (tn * 9 + 9 > tris.length) { const g = new Float32Array(tris.length * 2); g.set(tris); tris = g; }
        const o = tn * 9;
        tris[o] = verts[a * 3]; tris[o + 1] = verts[a * 3 + 1]; tris[o + 2] = verts[a * 3 + 2];
        tris[o + 3] = verts[b * 3]; tris[o + 4] = verts[b * 3 + 1]; tris[o + 5] = verts[b * 3 + 2];
        tris[o + 6] = verts[d * 3]; tris[o + 7] = verts[d * 3 + 1]; tris[o + 8] = verts[d * 3 + 2];
        tn++;
      }
    }
    while (p < n && bytes[p] !== 10) p++;                 // next line
    p++;
  }
  return tris.slice(0, tn * 9);
}

async function loadFile(file) {
  const busy = $('busy');
  busy.textContent = `Loading ${file.name} (${(file.size / 1048576).toFixed(0)} MB)…`;
  busy.style.display = 'flex';
  await new Promise(r => setTimeout(r, 30));   // let the overlay paint before the heavy work
  try {
    const ext = file.name.split('.').pop().toLowerCase();
    let pos;
    if (ext === 'stl') {
      pos = geometryToPositions(new STLLoader().parse(await file.arrayBuffer()));
    } else if (ext === 'obj') {
      pos = parseOBJ(new Uint8Array(await file.arrayBuffer()));
    } else throw new Error('Unsupported file type: .' + ext);
    if (!pos.length) throw new Error('No triangles found in file');
    fileName = file.name.replace(/\.[^.]+$/, '');
    undoStack = [];
    setMesh(pos, true);
  } catch (err) {
    console.error(err); toast('Load failed: ' + err.message);
  } finally {
    busy.style.display = 'none';
  }
}

$('file').addEventListener('change', e => { const f = e.target.files[0]; if (f) loadFile(f); e.target.value = ''; });
$('demo').onclick = () => {
  fileName = 'demo_sphere'; undoStack = [];
  setMesh(geometryToPositions(new THREE.IcosahedronGeometry(1, 5)), true);
};
addEventListener('dragover', e => { e.preventDefault(); $('drop').style.display = 'flex'; });
addEventListener('dragleave', e => { if (!e.relatedTarget) $('drop').style.display = 'none'; });
addEventListener('drop', e => {
  e.preventDefault(); $('drop').style.display = 'none';
  const f = e.dataTransfer.files[0]; if (f) loadFile(f);
});

// ---------- selection ----------
function refreshColors() {
  const c = geom.attributes.color.array;
  for (let i = 0; i < nTri; i++) {
    const col = selected[i] ? SEL : BASE;
    for (let v = 0; v < 3; v++) { const o = i * 9 + v * 3; c[o] = col[0]; c[o + 1] = col[1]; c[o + 2] = col[2]; }
  }
  geom.attributes.color.needsUpdate = true;
  selCount = 0; for (let i = 0; i < nTri; i++) selCount += selected[i];
  updateUI();
}

function applyMask(mask, mode) {   // mode: 'set' | 'add' | 'sub'
  for (let i = 0; i < nTri; i++) {
    if (mode === 'set') selected[i] = mask[i];
    else if (mode === 'add') selected[i] |= mask[i];
    else if (mask[i]) selected[i] = 0;
  }
  refreshColors();
}

// render id pass and return a reader for a CSS-pixel rect
function readIds(x0, y0, x1, y1) {
  const cssW = stage.clientWidth, cssH = stage.clientHeight;
  const sx = rt.width / cssW, sy = rt.height / cssH;
  const px0 = Math.max(0, Math.floor(x0 * sx)), px1 = Math.min(rt.width, Math.ceil(x1 * sx));
  const py0 = Math.max(0, Math.floor(y0 * sy)), py1 = Math.min(rt.height, Math.ceil(y1 * sy));
  const w = px1 - px0, h = py1 - py0;
  if (w <= 0 || h <= 0) return null;
  camera.updateMatrixWorld();
  renderer.setRenderTarget(rt);
  renderer.clear();
  renderer.render(idScene, camera);
  const buf = new Uint8Array(w * h * 4);
  renderer.readRenderTargetPixels(rt, px0, rt.height - py1, w, h, buf);
  renderer.setRenderTarget(null);
  return buf;
}

function maskFromVisible(x0, y0, x1, y1) {
  const mask = new Uint8Array(nTri);
  const buf = readIds(x0, y0, x1, y1);
  if (!buf) return mask;
  for (let p = 0; p < buf.length; p += 4) {
    const id = buf[p] | (buf[p + 1] << 8) | (buf[p + 2] << 16);
    if (id > 0 && id <= nTri) mask[id - 1] = 1;
  }
  return mask;
}

function maskFromCentroids(x0, y0, x1, y1) {   // x-ray: ignores occlusion
  const mask = new Uint8Array(nTri);
  const w = stage.clientWidth, h = stage.clientHeight;
  camera.updateMatrixWorld(); mesh.updateMatrixWorld();
  const e = new THREE.Matrix4().multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse)
    .multiply(mesh.matrixWorld).elements;
  const P = positions;
  for (let i = 0; i < nTri; i++) {
    const o = i * 9;
    const cx = (P[o] + P[o + 3] + P[o + 6]) / 3, cy = (P[o + 1] + P[o + 4] + P[o + 7]) / 3, cz = (P[o + 2] + P[o + 5] + P[o + 8]) / 3;
    const cw = e[3] * cx + e[7] * cy + e[11] * cz + e[15];
    if (cw <= 0) continue;
    const nx = (e[0] * cx + e[4] * cy + e[8] * cz + e[12]) / cw;
    const ny = (e[1] * cx + e[5] * cy + e[9] * cz + e[13]) / cw;
    const sx = (nx * 0.5 + 0.5) * w, sy = (1 - (ny * 0.5 + 0.5)) * h;
    if (sx >= x0 && sx <= x1 && sy >= y0 && sy <= y1) mask[i] = 1;
  }
  return mask;
}

// ---------- pointer interaction ----------
let drag = null;
canvas.addEventListener('pointerdown', e => {
  if (e.button !== 0 || !nTri) return;
  const r = canvas.getBoundingClientRect();
  drag = { x: e.clientX - r.left, y: e.clientY - r.top, cx: e.clientX, cy: e.clientY, box: e.shiftKey || boxTool, moved: false };
  if (drag.box) controls.enabled = false;   // capture phase: runs before OrbitControls
}, { capture: true });

addEventListener('pointermove', e => {
  if (!drag) return;
  if (Math.hypot(e.clientX - drag.cx, e.clientY - drag.cy) > 4) drag.moved = true;
  if (drag.box && drag.moved) {
    const r = canvas.getBoundingClientRect();
    const x = e.clientX - r.left, y = e.clientY - r.top;
    Object.assign(boxEl.style, {
      display: 'block', left: Math.min(x, drag.x) + 'px', top: Math.min(y, drag.y) + 'px',
      width: Math.abs(x - drag.x) + 'px', height: Math.abs(y - drag.y) + 'px',
    });
  }
});

addEventListener('pointerup', e => {
  if (!drag) return;
  const d = drag; drag = null;
  controls.enabled = true;
  boxEl.style.display = 'none';
  const r = canvas.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  if (!d.moved) {                              // click: toggle one triangle
    const buf = readIds(d.x, d.y, d.x + 1, d.y + 1);
    if (!buf) return;
    const id = buf[0] | (buf[1] << 8) | (buf[2] << 16);
    if (id > 0 && id <= nTri) {                // O(1) update, matters on multi-million-triangle meshes
      const i = id - 1, on = selected[i] ^= 1, col = on ? SEL : BASE, c = geom.attributes.color.array;
      for (let v = 0; v < 3; v++) { const o = i * 9 + v * 3; c[o] = col[0]; c[o + 1] = col[1]; c[o + 2] = col[2]; }
      geom.attributes.color.needsUpdate = true;
      selCount += on ? 1 : -1;
      updateUI();
    }
  } else if (d.box) {                          // box: replace / ctrl add / alt subtract
    const x0 = Math.min(x, d.x), x1 = Math.max(x, d.x), y0 = Math.min(y, d.y), y1 = Math.max(y, d.y);
    const mask = $('visOnly').checked ? maskFromVisible(x0, y0, x1, y1) : maskFromCentroids(x0, y0, x1, y1);
    applyMask(mask, e.altKey ? 'sub' : (e.ctrlKey || e.metaKey) ? 'add' : 'set');
  }
});

// ---------- actions ----------
function deleteSelected() {
  if (!selCount) return;
  undoStack.push(positions);
  // cap undo history by memory (~600 MB) so huge meshes don't exhaust the tab
  while (undoStack.length > 20 || (undoStack.length > 1 && undoStack.reduce((s, a) => s + a.byteLength, 0) > 6e8)) undoStack.shift();
  const out = new Float32Array((nTri - selCount) * 9);
  let w = 0;
  for (let i = 0; i < nTri; i++) {
    if (selected[i]) continue;
    out.set(positions.subarray(i * 9, i * 9 + 9), w); w += 9;
  }
  setMesh(out, false);
}
function undo() { if (undoStack.length) setMesh(undoStack.pop(), false); }
function selectAll() { applyMask(new Uint8Array(nTri).fill(1), 'set'); }
function clearSel() { if (nTri) applyMask(new Uint8Array(nTri), 'set'); }
function invertSel() { for (let i = 0; i < nTri; i++) selected[i] ^= 1; refreshColors(); }
function toggleWire() { $('wire').classList.toggle('on'); if (wire) wire.visible = $('wire').classList.contains('on'); }
function toggleBox() { boxTool = !boxTool; $('boxTool').classList.toggle('on', boxTool); canvas.style.cursor = boxTool ? 'crosshair' : ''; }

$('del').onclick = deleteSelected; $('undo').onclick = undo; $('all').onclick = selectAll;
$('clear').onclick = clearSel; $('invert').onclick = invertSel; $('wire').onclick = toggleWire;
$('boxTool').onclick = toggleBox; $('home').onclick = focusView;

addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (e.ctrlKey || e.metaKey) {
    if (k === 'z') { e.preventDefault(); undo(); }
    else if (k === 'a') { e.preventDefault(); selectAll(); }
    return;
  }
  if (k === 'delete' || k === 'backspace') deleteSelected();
  else if (k === 'escape') clearSel();
  else if (k === 'a') selectAll();
  else if (k === 'i') invertSel();
  else if (k === 'w') toggleWire();
  else if (k === 'b') toggleBox();
  else if (k === 'f') focusView();
});

// ---------- export ----------
function download(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}

function exportSTL() {
  const P = positions, buf = new ArrayBuffer(84 + 50 * nTri), dv = new DataView(buf);
  new TextEncoder().encodeInto('Triangle Eraser binary STL', new Uint8Array(buf, 0, 80));
  dv.setUint32(80, nTri, true);
  let o = 84;
  for (let i = 0; i < nTri; i++) {
    const j = i * 9;
    const ux = P[j + 3] - P[j], uy = P[j + 4] - P[j + 1], uz = P[j + 5] - P[j + 2];
    const vx = P[j + 6] - P[j], vy = P[j + 7] - P[j + 1], vz = P[j + 8] - P[j + 2];
    let nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
    const l = Math.hypot(nx, ny, nz) || 1; nx /= l; ny /= l; nz /= l;
    dv.setFloat32(o, nx, true); dv.setFloat32(o + 4, ny, true); dv.setFloat32(o + 8, nz, true);
    for (let k = 0; k < 9; k++) dv.setFloat32(o + 12 + k * 4, P[j + k], true);
    o += 50;
  }
  download(new Blob([buf], { type: 'model/stl' }), fileName + '_edited.stl');
}

function exportOBJ() {
  const P = positions, map = new Map(), verts = [], faces = [];
  for (let i = 0; i < nTri; i++) {
    const idx = [];
    for (let v = 0; v < 3; v++) {
      const o = i * 9 + v * 3, x = P[o], y = P[o + 1], z = P[o + 2], key = x + ',' + y + ',' + z;
      let id = map.get(key);
      if (id === undefined) { id = map.size + 1; map.set(key, id); verts.push(`v ${x} ${y} ${z}`); }
      idx.push(id);
    }
    faces.push(`f ${idx[0]} ${idx[1]} ${idx[2]}`);
  }
  const text = `# Triangle Eraser\no ${fileName}\n${verts.join('\n')}\n${faces.join('\n')}\n`;
  download(new Blob([text], { type: 'text/plain' }), fileName + '_edited.obj');
}
$('saveStl').onclick = exportSTL; $('saveObj').onclick = exportOBJ;

// ---------- loop ----------
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  const pr = renderer.getPixelRatio();
  rt.setSize(Math.floor(w * pr), Math.floor(h * pr));
}
new ResizeObserver(resize).observe(stage);
resize();
updateUI();

renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
